name: Firebase Multi-Env Deploy

on:
  push:
    branches:
      - test
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ "${{ github.ref }}" == "refs/heads/test" ]; then
            firebase deploy --only hosting:465869935690-test
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            firebase deploy --only hosting:himanshu-singh-portfolio-4e9de
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            firebase deploy --only hosting:himanshu-portfolio-2b6b1
          else
            echo "No matching branch, skipping deploy."
          fi
